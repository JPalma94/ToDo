<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4F46E5" />
  <meta name="description" content="ToDo" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ToDo" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/appIcon.png" />
  <link rel="stylesheet" href="styles.css?v=20260912" />
  <title>ToDo</title>
</head>
<body>
  <main>
    <!-- App header -->
    <div class="logo"><span class="logo-aj">AJ's</span> <span class="logo-todo">ToDoList</span></div>
    <div class="title-badge" aria-label="App theme icon">🛒</div>

    <!-- Main navigation -->
    <nav class="page-nav">
      <button id="calc-btn" title="Calculator mode">€</button>
      <button id="reset-btn" title="Reset list">↺</button>
      <button id="theme-btn" title="Themes" aria-label="Themes">◐</button>
    </nav>

    <div class="bottom-nav" aria-label="Main navigation">
      <button class="nav-btn active" data-page="home">LIST</button>
      <button class="nav-btn" data-page="backlog">BACKLOG</button>
      <button class="nav-btn" data-page="all-items">ALL</button>
    </div>

    <!-- Theme menu -->
    <div id="theme-menu" class="theme-menu" hidden>
      <div class="theme-menu-title">Choose theme</div>
      <div id="theme-picker" class="theme-picker">
        <button class="theme-option active" data-theme="default" type="button">
          <span class="theme-swatch theme-default"></span>
          <span class="theme-label">Default</span>
        </button>
        <button class="theme-option" data-theme="pink" type="button">
          <span class="theme-swatch theme-pink"></span>
          <span class="theme-label">Pink</span>
        </button>
      </div>
    </div>

    <!-- Main content sections -->
    <section id="page-home">
      <div class="input-row">
        <div class="input-wrapper">
          <input type="text" id="new-item" placeholder="Add an item..." autocomplete="off" />
          <ul id="suggestions" hidden></ul>
        </div>
        <button id="add-btn">Add</button>
      </div>
      <div class="counters">
        <div id="cart-total"></div>
        <div id="item-count"></div>
      </div>
      <ul id="todo-list"></ul>
      <button id="clear-btn" hidden>Clear completed</button>
    </section>

    <section id="page-backlog" hidden>
      <div class="input-row">
        <div class="input-wrapper">
          <input type="text" id="new-backlog-item" placeholder="Add to backlog..." autocomplete="off" />
          <ul id="backlog-suggestions" hidden></ul>
        </div>
        <button id="add-backlog-btn">Add</button>
      </div>
      <ul id="backlog-list"></ul>
      <button id="clear-backlog-btn" hidden>Clear completed</button>
      <button id="add-all-to-list-btn" class="add-all-btn">Add all to list</button>
    </section>

    <section id="page-all-items" hidden></section>
  </main>

  <!-- Modal overlays -->
  <div id="price-modal" class="modal" hidden>
    <div class="modal-content">
      <div id="price-item-name" class="modal-title"></div>
      <label for="price-input">Price (€)</label>
      <input type="number" id="price-input" step="0.01" inputmode="decimal" placeholder="0.00" />
      <div class="modal-buttons">
        <button id="price-back-btn" class="modal-btn back">Back</button>
        <button id="price-confirm-btn" class="modal-btn confirm">Confirm</button>
      </div>
    </div>
  </div>

  <div id="confirm-modal" class="modal" hidden>
    <div class="modal-content">
      <div id="confirm-message" class="modal-title"></div>
      <div class="modal-buttons">
        <button id="confirm-cancel-btn" class="modal-btn back">Cancel</button>
        <button id="confirm-ok-btn" class="modal-btn confirm">OK</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <script src="app.js?v=20260912" type="module"></script>
</body>
</html>
